version: '3.8'

services:
  peopleos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peopleos-app
    restart: always
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
